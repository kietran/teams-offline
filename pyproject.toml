[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teams-offline-archive"
version = "0.3.0"
description = "Local Chrome-captured Microsoft Teams channel archive for Windows and Linux"
requires-python = ">=3.12"
dependencies = [
  "bleach>=6.2,<7",
  "fastapi>=0.115,<1",
  "platformdirs>=4.3,<5",
  "playwright>=1.55,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pyinstaller>=6.16,<7",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[project.scripts]
teams-offline-archive = "teams_archive.main:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/teams_archive"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
